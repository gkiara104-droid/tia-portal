<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mem={},inp={},tm={},sim=0,first=1,run=false,plant={},tst=null,last=performance.now();
const Q=a=>mem['%Q'+a]|0;
const lamp=(x,y,on,c)=>`<circle cx="${x}" cy="${y}" r="13" fill="${on?c:'#555'}" stroke="#111"/>`;
const I=n=>`%I${(n-1)>>3}.${(n-1)&7}`,O=n=>`%Q${(n-1)>>3}.${(n-1)&7}`;
const bt=(n,l,k,d)=>({a:I(n),n:'S'+n,l,k:k||'b',d}),au=(n,l)=>({a:I(n),n:'S'+n,l,k:'a'}),ho=(n,l,c)=>[O(n),'H'+n+' '+l,c],yo=(n,l,c)=>[O(n),'Y'+n+' '+l,c];
const mk=(id,name,txt,io,out,ax,comps)=>{ax=ax||[];return{id,name,txt,io,out,ax,comps:(comps||[]).map(t=>({t})),init:()=>ax.map(x=>x.p||0),
 step(s,dt){ax.forEach((x,i)=>{const f=mem[x.f]|0,b=x.sp?!f:mem[x.b]|0,d=x.v*dt/1000;if(f&&!b)s[i]=Math.min(1,s[i]+d);else if(b&&!f)s[i]=Math.max(0,s[i]-d);const n=x.nc?1:0;if(x.sf)inp[I(x.sf)]=(s[i]>=1?1:0)^n;if(x.sb)inp[I(x.sb)]=(s[i]<=0?1:0)^n})},
 draw(s){const n=ax.length;let g=`<svg viewBox="0 0 300 ${30+n*26+Math.ceil(out.length/4)*38}">`;ax.forEach((x,i)=>{const y=14+i*26;g+=`<text x="2" y="${y+9}" font-size="10" fill="currentColor">${x.l}</text><rect x="95" y="${y}" width="205" height="10" fill="#dde3e8" stroke="#99a"/><rect x="${95+s[i]*185}" y="${y-3}" width="20" height="16" fill="#0a6ebd"/>`});
  out.forEach((q,i)=>{const cx=30+(i%4)*72,cy=26+n*26+Math.floor(i/4)*38;g+=lamp(cx,cy,mem[q[0]],q[2]||'#fc0')+`<text x="${cx}" y="${cy+25}" text-anchor="middle" font-size="9" fill="currentColor">${q[1].split(' ')[0]}</text>`});return g+'</svg>'}}};
const sw=[1,2,3,4,5,6,7,8].map(n=>bt(n,'Sensor S'+n,'s'));
const SC=[
mk('sem','1 · Semáforos de obra','<b>1 · Semáforos de obra (CLC3401).</b> Tráfico limitado a un carril regulado por semáforos. Al encender con el interruptor S3, ambas luces en rojo (H2 y H3). Dos bucles de inducción (S1, S2) indican presencia de tráfico.<br>La fase verde dura ≥ 20 s antes de que el otro iniciador ponga ambas luces en rojo. Tras 10 s de despeje, se da verde al flujo contrario (H1 o H4). Sin vehículos esperando, el sistema se queda en su último estado. Solo se puede apagar cuando uno de los carriles está en verde.',
 [bt(3,'Interruptor ON/OFF','s'),bt(1,'Bucle inducción S1','s'),bt(2,'Bucle inducción S2','s')],[ho(1,'Verde A','#2d4'),ho(3,'Rojo A','#e33'),ho(4,'Verde B','#2d4'),ho(2,'Rojo B','#e33')],0,['Ámbar intermitente (1 Hz) 3 s antes de cada cambio a rojo.','Si ambos bucles llevan activos más de 60 s, parpadeo de aviso.']),
mk('tank','6 · Llenado de tanques','<b>6 · Planta de llenado de tanques (CLC3406).</b> Tres tanques que se vacían a mano en cualquier orden. S1 inicio, S2 parada. Válvulas de llenado H1, H2, H3. Sensores lleno S3, S5, S7 y vacío S4, S6, S8 (dan 1 si detectan líquido).<br>Solo se llena un tanque a la vez, y solo tras señalar su estado vacío; el llenado continúa hasta que se activa su sensor de lleno. Si lleno y vacío de un tanque están activos a la vez: fallo en la lámpara H4, que se borra con parada; reinicio con inicio. Con fallo, no se llena ningún tanque. Condición inicial: tanques llenos.',
 [bt(1,'Inicio'),bt(2,'Parada'),bt(3,'Tanque 1 lleno','s',1),bt(4,'Tanque 1 (mín.)','s',1),bt(5,'Tanque 2 lleno','s',1),bt(6,'Tanque 2 (mín.)','s',1),bt(7,'Tanque 3 lleno','s',1),bt(8,'Tanque 3 (mín.)','s',1)],[ho(1,'Válvula T1','#29d'),ho(2,'Válvula T2','#29d'),ho(3,'Válvula T3','#29d'),ho(4,'Fallo','#e33')],0,['Contador de ciclos de llenado por tanque (CTU).','Tiempo máximo de llenado 10 s: si se supera, fallo.']),
mk('plat','8 · Plataforma de cambio','<b>8 · Plataforma de cambio de mercancía (CLC3408).</b> Carro y grúa con imán pasan piezas de la cinta 1 a la 2. Estado inicial: carro a la izquierda, imán arriba y apagado. S1 inicio; S2 apaga en cualquier momento.<br>1) Pieza en S7 → baja imán (K2/H2). 2) S14: para y enciende imán (K5/H5). 3) A los 2 s sube (K1/H1) hasta S13. 4) Carro a la derecha (K3/H3) hasta S15. 5) Baja imán (K2) hasta S14 y lo apaga (pieza en cinta 2). 6) Con S8 activa, a los 2 s sube el imán hasta S13. 7) Carro a la izquierda (K4/H4) hasta S16: estado inicial. Una nueva pieza (S7) repite el proceso.',
 [bt(1,'Inicio'),bt(2,'Parada'),bt(7,'Pieza en cinta 1','s'),bt(8,'Pieza en cinta 2','s'),au(13,'FC imán arriba'),au(14,'FC imán abajo'),au(15,'FC carro derecha'),au(16,'FC carro izquierda')],[ho(1,'K1 subir'),ho(2,'K2 bajar'),ho(3,'K3 derecha'),ho(4,'K4 izquierda'),ho(5,'K5 imán','#29d')],[{l:'Imán (arriba=dcha)',f:O(1),b:O(2),sf:13,sb:14,v:.5,p:1},{l:'Carro (dcha=dcha)',f:O(3),b:O(4),sf:15,sb:16,v:.4}],['Contador de piezas transferidas.','Si el imán tarda >8 s en bajar o subir, parada por fallo.']),
mk('alm','9 · Almacén intermedio','<b>9 · Almacén intermedio de piezas (CLC3409).</b> Buffer en una cadena de montaje: entrada detectada por B1 (S3), salida por B2 (S4). Con 30 piezas se apaga el motor M1 (H1) de la cinta; cuando baja de 30 vuelve a conectarse. Con menos de 10 piezas se enciende la lámpara H2. El contador se pone a cero con S5 (calibrado al inicio de turno). S1 inicio, S2 parada.',
 [bt(1,'Inicio'),bt(2,'Parada'),bt(3,'B1 entrada de pieza'),bt(4,'B2 salida de pieza'),bt(5,'Calibrar (reset)')],[ho(1,'Motor M1 cinta'),ho(2,'Lámpara <10','#e83')],0,['Tercera lámpara cuando haya más de 25 piezas (aviso previo).','Contador que muestre las piezas totales que han pasado en el turno.']),
mk('oven','14 · Horno: puerta','<b>14 · Horno. Control de la puerta (CLC3414).</b> Válvula 5/3. Estado inicial: puerta cerrada. S1 abre (Y2). S14 (fin de carrera) o S3 (stop) detienen Y2. Tras pararse, la puerta cierra sola con 6 s de retraso (Y1); también se puede cerrar con S2. S3 puede interrumpir el cierre; si se pulsa varias veces y el tiempo total (desde que empezó a cerrar) supera 30 s, S3 se inhibe y cierra sin hacerle caso. El cierre acaba en S13. Si se interrumpe la barrera B1 (S4), el cierre se detiene y continúa al liberarse. S13 y S14 son NC (a prueba de fallos).',
 [bt(1,'Abrir'),bt(2,'Cerrar'),bt(3,'Stop'),bt(4,'Barrera B1 interrumpida','s'),au(13,'FC cerrada (NC)'),au(14,'FC abierta (NC)')],[yo(1,'Cerrar','#e83'),yo(2,'Abrir','#2d4')],[{l:'Puerta (dcha=abierta)',f:O(2),b:O(1),sf:14,sb:13,nc:1,v:.17}],['Aviso luminoso parpadeante (1 Hz) mientras se cierra.','Contador de aperturas del turno.']),
mk('bend','15 · Dobladora','<b>15 · Dobladora (CLC3415).</b> 3 cilindros neumáticos. Con la chapa colocada a mano, S1 inicia; la máquina se reposiciona (Y1, Y4, Y6 retraen los 3 pistones). Luego: Y2 extiende pistón 1 (sujeta) → S17: apaga Y2, Y3 extiende pistón 2 (dobla 90°) → S15: apaga Y3, espera 2 s, Y4 sube el pistón 2 → S16: apaga Y4, Y5 extiende pistón 3 (forma final) → S14: apaga Y5, espera 2 s, Y6 retrae → S13: apaga Y6, Y1 retrae pistón 1 → S18: apaga Y1. Con S1 se repite. S2 detiene en cualquier momento; S1 reactiva los movimientos hasta el estado inicial.',
 [bt(1,'Inicio'),bt(2,'Parada'),au(13,'S13 pistón 3 atrás'),au(14,'S14 pistón 3 delante'),au(15,'S15 pistón 2 abajo'),au(16,'S16 pistón 2 arriba'),au(17,'S17 pistón 1 delante'),au(18,'S18 pistón 1 atrás')],[yo(1,'P1 retrae'),yo(2,'P1 extiende'),yo(3,'P2 extiende'),yo(4,'P2 retrae'),yo(5,'P3 extiende'),yo(6,'P3 retrae')],[{l:'Pistón 1',f:O(2),b:O(1),sf:17,sb:18,v:.6},{l:'Pistón 2',f:O(3),b:O(4),sf:15,sb:16,v:.6},{l:'Pistón 3',f:O(5),b:O(6),sf:14,sb:13,v:.6}],['Contador de piezas dobladas.','Modo ciclo único / continuo con un interruptor.']),
mk('drill','17 · Taladro','<b>17 · Sistema de taladro (CLC3417).</b> Con S1 el sistema va al estado inicial (Y1, Y3, Y6 retraen los 3 pistones). Luego Y2 extiende el pistón 1 (fija la pieza) → S14: apaga Y2, Y5 extiende el pistón 3 (taladro) → S17: apaga Y5, Y6 retrae → S18: apaga Y6, Y1 libera la pieza → S13: apaga Y1, Y4 levanta (pistón 2) → S16: apaga Y4, Y7 sopla aire 2 s y a la vez Y3 retrae el pistón 2 hasta S15. Se repite solo. S2 para en cualquier momento; S1 vuelve al estado inicial y reanuda.',
 [bt(1,'Inicio'),bt(2,'Parada'),au(13,'S13 pistón 1 atrás'),au(14,'S14 pistón 1 delante'),au(15,'S15 pistón 2 abajo'),au(16,'S16 pistón 2 arriba'),au(17,'S17 taladro abajo'),au(18,'S18 taladro arriba')],[yo(1,'P1 retrae'),yo(2,'P1 extiende'),yo(3,'P2 retrae'),yo(4,'P2 sube'),yo(5,'Taladro baja'),yo(6,'Taladro sube'),yo(7,'Aire','#29d')],[{l:'Pistón 1',f:O(2),b:O(1),sf:14,sb:13,v:.6},{l:'Pistón 2 (expulsor)',f:O(4),b:O(3),sf:16,sb:15,v:.6},{l:'Taladro',f:O(5),b:O(6),sf:17,sb:18,v:.6}],['Parar tras N piezas (contador).','Dos pasadas de taladro por pieza.']),
mk('dist','18 · Distribuidor de piezas','<b>18 · Distribuidor selectivo de piezas (CLC3418).</b> Distingue piezas cortas y largas con 3 células S5, S6, S7. S1 enciende el sistema; el distribuidor está en posición A. Pieza larga: los tres sensores se activan a la vez y se queda en A. Pieza corta: las barreras se activan una tras otra → H1 mueve el distribuidor a B (reed S9) un máximo de 5 s y vuelve a A al desconectar H1. Si se detecta una pieza larga, puede volver antes a A.',
 [bt(1,'Inicio'),bt(2,'Parada'),bt(5,'Célula S5'),bt(6,'Célula S6'),bt(7,'Célula S7'),au(9,'Reed S9 (pos. B)')],[ho(1,'Electroválvula')],[{l:'Distribuidor (dcha=B)',f:O(1),sp:1,sf:9,v:.5}],['Contador de piezas cortas y largas.','Si hay 3 piezas cortas seguidas, aviso luminoso.']),
mk('door','20 · Control de puerta','<b>20 · Control de puerta (CLC3420).</b> Contactores H1 (cerrar) y H2 (abrir). S1 = automático: pulsación breve de S3 abre (H2) hasta S14; pulsación breve de S4 cierra (H1) hasta S13. S5 interrumpe el movimiento; el obstáculo S7 también. S2 = manual (inching): abre mientras se mantiene S3, cierra mientras se mantiene S4; S13/S14/S7 igual. Si se seleccionan auto y manual a la vez, manda manual. Nunca los dos contactores a la vez. Finales de carrera NC (1 sin pulsar).',
 [bt(1,'Automático','s'),bt(2,'Manual (inching)','s'),bt(3,'Abrir'),bt(4,'Cerrar'),bt(5,'Halt'),bt(7,'Obstáculo','s'),au(13,'FC cerrada (NC)'),au(14,'FC abierta (NC)')],[ho(1,'Cerrar'),ho(2,'Abrir')],[{l:'Puerta (dcha=abierta)',f:O(2),b:O(1),sf:14,sb:13,nc:1,v:.25}],['Cierre automático a los 5 s de estar abierta.','Luz de aviso parpadeante mientras se mueve.']),
